packages:
  - "apps/*"
  - "packages/*"
  - "infra"

allowBuilds:
  "@swc/core": true
  aws-sdk: true
  esbuild: true
  lefthook: true
  msgpackr-extract: true
  sharp: true
  workerd: true

catalogMode: strict
cleanupUnusedCatalogs: true
disallowWorkspaceCycles: true
strictPeerDependencies: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@effect/*"
  - effect
blockExoticSubdeps: true

peerDependencyRules:
  allowedVersions:
    typescript: "7"

catalog:
  "@cloudflare/vitest-pool-workers": 0.20.1
  "@cloudflare/workers-types": 5.20260730.1
  "@effect/vitest": 4.0.0-beta.103
  "@swc/core": 1.15.47
  "@vitest/browser-playwright": 4.1.10
  "@vitest/coverage-istanbul": 4.1.10
  dependency-cruiser: 18.1.1
  effect: 4.0.0-beta.103
  knip: 6.31.0
  lefthook: 2.1.10
  oxfmt: 0.62.0
  oxlint: 1.77.0
  sst: 4.17.1
  typescript: 7.0.2
  vitest: 4.1.10
  wrangler: 4.118.0
